# This repo is a Hermes directory plugin (installed with `hermes plugins install`), not a
# pip package. [project].dependencies is what Hermes installs for the plugin: it is empty
# on purpose — httpx is already a core Hermes dependency.
[project]
name = "hermes-whatsapp-agent-platform"
version = "0.1.1"
description = "Meta WhatsApp Agent Platform adapter for Hermes Agent"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Hermes itself is installed separately from git (PyPI hermes-agent is outdated).
test = ["pytest==9.1.1", "pytest-asyncio==1.3.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
addopts = "-p no:cacheprovider --import-mode=importlib"
pythonpath = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
